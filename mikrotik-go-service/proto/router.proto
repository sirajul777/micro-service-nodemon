package router;

option go_package = "github.com/mikhmon/mikrotik-go-service/proto";

service RouterService {
  rpc TestConnect(TestConnectRequest) returns (TestConnectResponse);
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc ListActiveHotspotUsers(ListActiveRequest) returns (ListActiveResponse);
  rpc ListHotspotUsers(ListHotspotUsersRequest) returns (ListHotspotUsersResponse);
  rpc AddHotspotUser(AddHotspotUserRequest) returns (AddHotspotUserResponse);
  rpc RemoveHotspotUser(RemoveHotspotUserRequest) returns (RemoveHotspotUserResponse);
  rpc DisableHotspotUser(DisableHotspotUserRequest) returns (DisableHotspotUserResponse);
  rpc EnableHotspotUser(EnableHotspotUserRequest) returns (EnableHotspotUserResponse);
  rpc ListHotspotProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc GetHotspotProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc AddHotspotProfile(AddHotspotProfileRequest) returns (AddHotspotProfileResponse);
  rpc UpdateHotspotProfile(UpdateHotspotProfileRequest) returns (UpdateHotspotProfileResponse);
  rpc DeleteHotspotProfile(DeleteHotspotProfileRequest) returns (DeleteHotspotProfileResponse);
  rpc BulkRemoveHotspotUsers(BulkRemoveHotspotUsersRequest) returns (BulkRemoveHotspotUsersResponse);
  rpc SetupExpiryScheduler(SetupExpirySchedulerRequest) returns (SetupExpirySchedulerResponse);
  rpc ListDhcpLeases(ListDhcpLeasesRequest) returns (ListDhcpLeasesResponse);
  rpc ListSchedulers(ListSchedulersRequest) returns (ListSchedulersResponse);
  rpc AddScheduler(AddSchedulerRequest) returns (AddSchedulerResponse);
  rpc UpdateScheduler(UpdateSchedulerRequest) returns (UpdateSchedulerResponse);
  rpc ListLogs(ListLogsRequest) returns (ListLogsResponse);
  rpc ListSellingScripts(ListSellingScriptsRequest) returns (ListSellingScriptsResponse);
  rpc GetSystemResource(SystemResourceRequest) returns (SystemResourceResponse);
  rpc GetInterfaces(InterfacesRequest) returns (InterfacesResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc UpdateSession(UpdateSessionRequest) returns (UpdateSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc ListPppSecrets(ListPppSecretsRequest) returns (ListPppSecretsResponse);
  rpc GetPppSecret(GetPppSecretRequest) returns (GetPppSecretResponse);
  rpc AddPppSecret(AddPppSecretRequest) returns (AddPppSecretResponse);
  rpc UpdatePppSecret(UpdatePppSecretRequest) returns (UpdatePppSecretResponse);
  rpc DeletePppSecret(DeletePppSecretRequest) returns (DeletePppSecretResponse);
  rpc EnablePppSecret(EnablePppSecretRequest) returns (EnablePppSecretResponse);
  rpc DisablePppSecret(DisablePppSecretRequest) returns (DisablePppSecretResponse);
  rpc ListPppProfiles(ListPppProfilesRequest) returns (ListPppProfilesResponse);
  rpc AddPppProfile(AddPppProfileRequest) returns (AddPppProfileResponse);
  rpc UpdatePppProfile(UpdatePppProfileRequest) returns (UpdatePppProfileResponse);
  rpc DeletePppProfile(DeletePppProfileRequest) returns (DeletePppProfileResponse);
  rpc ListPppActive(ListPppActiveRequest) returns (ListPppActiveResponse);
  rpc DisconnectPppActive(DisconnectPppActiveRequest) returns (DisconnectPppActiveResponse);
  rpc ListPppPools(ListPppPoolsRequest) returns (ListPppPoolsResponse);
}

message ListLogsRequest { string session_id = 1; string topics = 2; }
message LogEntry { string id = 1; string time = 2; string topics = 3; string message = 4; }
message ListLogsResponse { bool success = 1; string error = 2; repeated LogEntry logs = 3; }

message ListDhcpLeasesRequest { string session_id = 1; }
message DhcpLease {
  string id = 1;
  string address = 2;
  string mac_address = 3;
  string client_id = 4;
  string server = 5;
  string status = 6;
  string expires_after = 7;
  string last_seen = 8;
  string active_address = 9;
  string active_mac_address = 10;
  string host_name = 11;
  string comment = 12;
  string disabled = 13;
}
message ListDhcpLeasesResponse { bool success = 1; string error = 2; repeated DhcpLease leases = 3; }

message Scheduler {
  string id = 1;
  string name = 2;
  string start_date = 3;
  string start_time = 4;
  string interval = 5;
  string on_event = 6;
  string disabled = 7;
  string comment = 8;
}
message ListSchedulersRequest { string session_id = 1; }
message ListSchedulersResponse { bool success = 1; string error = 2; repeated Scheduler schedulers = 3; }
message AddSchedulerRequest {
  string session_id = 1;
  string name = 2;
  string start_date = 3;
  string start_time = 4;
  string interval = 5;
  string on_event = 6;
  string disabled = 7;
  string comment = 8;
}
message AddSchedulerResponse { bool success = 1; string error = 2; }
message UpdateSchedulerRequest {
  string session_id = 1;
  string name = 2;
  string on_event = 3;
  string disabled = 4;
  string comment = 5;
}
message UpdateSchedulerResponse { bool success = 1; string error = 2; }
