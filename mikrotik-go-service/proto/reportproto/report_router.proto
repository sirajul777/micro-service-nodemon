syntax = "proto3";

package report.router;

option go_package = "github.com/mikhmon/mikrotik-go-service/proto/reportproto";

service ReportRouterService {
  rpc ListSellingScripts(ListSellingScriptsRequest) returns (ListSellingScriptsResponse);
}

message ListSellingScriptsRequest {
  string session_id = 1;
  string idhr = 2;
  string idbl = 3;
}

message SellingScript {
  string id = 1;
  string date = 2;
  string time = 3;
  string username = 4;
  double price = 5;
  string profile = 6;
  string comment = 7;
}

message ListSellingScriptsResponse {
  bool success = 1;
  string error = 2;
  repeated SellingScript scripts = 3;
}
