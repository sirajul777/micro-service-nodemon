version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# MikHMon — Microservice Infrastructure
# ─────────────────────────────────────────────────────────────────────────────

services:
  redis-broker:
    image: redis:7-alpine
    container_name: ms_redis_broker
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-super_secure_redis_pass_123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - net-mikrotik-cluster
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-super_secure_redis_pass_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-db:
    image: postgres:15-alpine
    container_name: ms_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_mikrotik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_postgres_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-db_mikrotik_app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - net-mikrotik-cluster
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_mikrotik} -d ${POSTGRES_DB:-db_mikrotik_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: nginx:alpine
    container_name: ms_nginx_gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main-node-service
      - auth-node-service
      - erp-node-service
      - payment-service
    networks:
      - net-mikrotik-cluster
    restart: always

  main-node-service:
    build:
      context: .
      dockerfile: ./main-node-service/Dockerfile
    container_name: ms_nestjs_main
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8080
      - AUTH_GRPC_ADDR=auth-node-service:50052
      - AUTH_GRPC_PROTO_PATH=/app/auth-proto/auth.proto
      - ERP_SERVICE_URL=http://erp-node-service:3003
      - PAYMENT_SERVICE_URL=http://payment-service:3002
      - BOT_SERVICE_URL=http://bot-py-service:8082
      - MIKROTIK_GRPC_SERVER=mikrotik-go-service:50051
      - SESSION_SECRET=${SESSION_SECRET:-mikhmon-session-secret}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-super_secure_redis_pass_123}@redis-broker:6379
    depends_on:
      - auth-node-service
      - erp-node-service
      - payment-service
      - redis-broker
    ports:
      - "8080:8080"
    networks:
      - net-mikrotik-cluster
    restart: on-failure

  auth-node-service:
    build:
      context: ./auth-node-service
      dockerfile: Dockerfile
    container_name: ms_nestjs_auth
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - AUTH_GRPC_PORT=0.0.0.0:50052
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-admin_mikrotik}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-super_postgres_password_123}
      - DB_NAME=db_auth
      - JWT_SECRET=${JWT_SECRET:-kunci_rahasia_auth_identity_provider_999}
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "3001:3001"
    expose:
      - "50052"
    networks:
      - net-mikrotik-cluster
    restart: on-failure

  erp-node-service:
    build:
      context: ./erp-node-service
      dockerfile: Dockerfile
    container_name: ms_nestjs_erp
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3003
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-admin_mikrotik}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-super_postgres_password_123}
      - DB_NAME=db_erp
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-super_secure_redis_pass_123}
      - MIKROTIK_GRPC_ADDR=mikrotik-go-service:50051
      - USE_REDIS_STREAMS=true
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    ports:
      - "3003:3003"
    networks:
      - net-mikrotik-cluster
    restart: on-failure

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: ms_nestjs_payment
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3002
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-admin_mikrotik}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-super_postgres_password_123}
      - DB_NAME=db_payment
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-super_secure_redis_pass_123}
      - JWT_SECRET=${JWT_SECRET:-kunci_rahasia_auth_identity_provider_999}
      - USE_REDIS_STREAMS=true
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    ports:
      - "3002:3002"
    networks:
      - net-mikrotik-cluster
    restart: on-failure

  mikrotik-go-service:
    build:
      context: ./mikrotik-go-service
      dockerfile: Dockerfile
    container_name: ms_golang_mikrotik
    expose:
      - "50051"
    environment:
      - GRPC_PORT=:50051
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-admin_mikrotik}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-super_postgres_password_123}
      - DB_NAME=db_router
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-super_secure_redis_pass_123}
      - USE_REDIS_STREAMS=true
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - net-mikrotik-cluster
    restart: on-failure

  bot-py-service:
    build:
      context: ./bot-py-service
      dockerfile: Dockerfile
    container_name: ms_python_bot
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-admin_mikrotik}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-super_postgres_password_123}
      - DB_NAME=db_bot
      - REDIS_HOST=redis-broker
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-super_secure_redis_pass_123}
      - USE_REDIS_STREAMS=true
      - MIKROTIK_GRPC_SERVER=mikrotik-go-service:50051
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      mikrotik-go-service:
        condition: service_started
    networks:
      - net-mikrotik-cluster
    restart: on-failure

networks:
  net-mikrotik-cluster:
    driver: bridge

volumes:
  pgdata:
  redis_data:
