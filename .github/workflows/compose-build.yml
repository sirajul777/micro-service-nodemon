name: Compose Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config -q

      - name: Build service images
        run: docker compose build --pull
