name: Compose Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config -q

      - name: Build service images
        run: docker compose build --pull

      - name: Start application services
        run: docker compose up -d auth-node-service erp-node-service payment-service mikrotik-go-service bot-py-service main-node-service

      - name: Wait for BFF health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/tmp/healthz.json 2>/dev/null; then
              cat /tmp/healthz.json
              exit 0
            fi
            sleep 2
          done
          echo 'BFF health check failed'
          docker compose ps
          docker compose logs --tail=200 main-node-service auth-node-service erp-node-service payment-service mikrotik-go-service bot-py-service
          exit 1

      - name: Verify internal health endpoints
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T main-node-service node - <<'NODE'
          const services = [
            ['auth-node-service', 3001],
            ['erp-node-service', 3003],
            ['payment-service', 3002],
            ['mikrotik-go-service', 8081],
          ];
          for (const [host, port] of services) {
            const url = `http://${host}:${port}/healthz`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${url} -> HTTP ${response.status}`);
            const body = await response.text();
            console.log(`${url} -> ${body}`);
          }
          NODE

      - name: Verify internal gRPC ports
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T main-node-service node - <<'NODE'
          const net = require('node:net');
          const targets = [
            ['auth-node-service', 50052],
            ['erp-node-service', 50053],
            ['payment-service', 50054],
            ['bot-py-service', 50055],
            ['mikrotik-go-service', 50051],
          ];
          const check = (host, port) => new Promise((resolve, reject) => {
            const socket = net.createConnection({ host, port, timeout: 3000 });
            socket.once('connect', () => { socket.destroy(); resolve(); });
            socket.once('timeout', () => { socket.destroy(); reject(new Error(`${host}:${port} timed out`)); });
            socket.once('error', reject);
          });
          for (const [host, port] of targets) {
            await check(host, port);
            console.log(`${host}:${port} -> reachable`);
          }
          NODE

      - name: Verify containers stay running
        shell: bash
        run: |
          set -euo pipefail
          docker compose ps
          exited=$(docker compose ps --status exited -q)
          if [ -n "$exited" ]; then
            echo 'One or more application containers exited unexpectedly'
            docker compose logs --tail=200 $exited
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
