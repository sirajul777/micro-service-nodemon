# ─────────────────────────────────────────────────────────────────────────────
# MikHMon — API Gateway (Nginx) reverse proxy & route table
#
# Single public entry point. Routes traffic to the internal services by path.
#
#   /                   → main-node-service (Gateway/BFF, serves Eta UI + static)
#   /api/auth/*         → auth-node-service
#   /api/voucher/*      → erp-node-service
#   /api/report/*       → erp-node-service
#   /api/qris/*         → payment-service
#   /payments/*         → payment-service
#   /qris/*             → payment-service
#
# For production, terminate TLS here (server block with ssl_certificate).
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # ── Rate limiting (Phase 8 hardening) ─────────────────────────────
    # Memoized zone shared across worker processes.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ── Upstreams (resolved via Docker internal DNS) ───────────────────────
    upstream main_upstream {
        server main-node-service:8080;
    }
    upstream auth_upstream {
        server auth-node-service:3001;
    }
    upstream erp_upstream {
        server erp-node-service:3003;
    }
    upstream payment_upstream {
        server payment-service:3002;
    }

    # ── General tuning ─────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;   # match the app's 50mb JSON limit
    server_tokens       off;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';

    # ── Server ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        access_log /var/log/nginx/access.log main;
        error_log  /var/log/nginx/error.log warn;

        # ── Security headers on every response (Phase 8) ──────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ── Health endpoint (no auth) ──────────────────────────────────────
        location = /healthz {
            access_log off;
            # A location-level `add_header` overrides inherited server-level
            # headers, so repeat the security headers here.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Type application/json always;
            return 200 '{"status":"ok","service":"api-gateway"}';
        }

        # ── Auth service (Phase 6: routed via BFF so cookie sessions +
        #    JWT caching work. BFF forwards to auth-node-service internally.)
        #    Login is rate-limited more strictly to blunt brute-force.
        location = /api/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/auth/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── BFF aggregate proxy (Phase 6): forwards to erp / payment / bot
        #    with the session JWT injected. Downstream services stay on the
        #    docker network and are never directly exposed.
        location /api/erp/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/payment/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/bot/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Sessions & Mikrotik routes (forward to BFF so session JWT is injected)
        location /api/sessions {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/mikrotik/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── ERP service (voucher + report) ────────────────────────────────
        location /api/batches/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/batches {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
location /api/voucher-types/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/voucher/ {
            # Phase 9: route via BFF so the session JWT is injected. The BFF
            # rewrites /api/voucher/:cs/profiles → /voucher/batches/:cs/import/profiles
            # and forwards to erp /voucher/*.
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/users/ {
            # Phase 9: route via BFF → auth /api/users (session JWT injected).
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/report/ {
            # Reports have no microservice backend yet (out of Phase 9 scope);
            # route via BFF so it responds cleanly instead of hitting erp
            # directly without a session.
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

# ── Payment service (QRIS / payhook / billing) ────────────────────
        #
        # Admin QRIS endpoints (/api/qris/*) are routed through the BFF so the
        # session is enforced and the cached JWT is injected — satisfying
        # payment-service's JwtAuthGuard. Public customer routes (/payments/*,
        # /qris/checkout, /qris/status) go straight to payment-service.
        location /api/qris/ {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /payments/ {
            proxy_pass http://payment_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /qris/ {
            proxy_pass http://payment_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Everything else → Gateway/BFF (UI + static) ──────────────────
        location / {
            proxy_pass http://main_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
