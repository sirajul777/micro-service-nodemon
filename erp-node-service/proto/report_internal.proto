syntax = "proto3";

package report.internal;

service ReportInternalService {
  rpc GetLiveReport(GetLiveReportRequest) returns (GetLiveReportResponse);
}

message GetLiveReportRequest { string session = 1; }
message GetLiveReportResponse {
  bool success = 1;
  string error = 2;
  int32 today_vouchers = 3;
  double today_income = 4;
  int32 month_vouchers = 5;
  double month_income = 6;
  string currency = 7;
  bool is_indo = 8;
}
